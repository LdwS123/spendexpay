<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spendex Consent</title>
<style>
  :root {
    --bg: #070d18;
    --bg-elevated: #0d1422;
    --accent: #00e5b4;
    --accent-dim: rgba(0, 229, 180, 0.12);
    --ink: #f4f6fa;
    --muted: #8a93a6;
    --border: #1a2235;
    --danger: #ff5c7a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100%;
  }
  .root {
    max-width: 460px;
    margin: 0 auto;
    padding: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .brand strong {
    color: var(--ink);
    letter-spacing: 0.04em;
  }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .action {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 14px;
    word-wrap: break-word;
  }
  .service-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .product {
    display: none;
    gap: 12px;
    align-items: flex-start;
    padding: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 14px 0 16px;
  }
  .product.show { display: flex; }
  .product-img {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    background: #14213d;
    object-fit: cover;
    flex-shrink: 0;
  }
  .product-img-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 24px;
  }
  .product-info {
    flex: 1;
    min-width: 0;
  }
  .product-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 4px;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .product-desc {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 4px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .product-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .product-link:hover { text-decoration: underline; }
  .amount {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 6px 0 18px;
    line-height: 1.1;
  }
  .amount .currency {
    font-size: 16px;
    color: var(--muted);
    font-weight: 500;
    margin-right: 4px;
    vertical-align: top;
  }
  .rules {
    border-top: 1px solid var(--border);
    margin-top: 16px;
    padding-top: 14px;
  }
  .rule-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 6px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .rule-line .v {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .meter {
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 6px 0 10px;
  }
  .meter .fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 240ms ease;
  }
  .meter .fill.warn { background: #ffb84a; }
  .meter .fill.over { background: var(--danger); }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  button {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 80ms ease, opacity 120ms ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.6; cursor: default; }
  .btn-primary {
    background: var(--accent);
    color: #022019;
    border: 1px solid var(--accent);
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .status {
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--danger); }
  .desc {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 14px;
    word-wrap: break-word;
  }
  .pending {
    opacity: 0.55;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="root" id="root">
  <div class="brand">
    <span class="dot"></span>
    <strong>Spendex Pay</strong>
    <span>&middot; consent</span>
  </div>
  <div class="card" id="card">
    <p class="section-label">Your agent wants to:</p>
    <h1 class="action" id="action">Loading...</h1>
    <div class="service-row">
      <span class="badge" id="service">--</span>
    </div>
    <p class="desc" id="desc"></p>
    <div class="product" id="product">
      <div class="product-img product-img-fallback" id="productImgWrap">📦</div>
      <div class="product-info">
        <p class="product-name" id="productName"></p>
        <p class="product-desc" id="productDesc"></p>
        <a class="product-link" id="productLink" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="amount">
      <span class="currency" id="amountCurrency">USD</span><span id="amountValue">--</span>
    </div>
    <div class="rules">
      <p class="section-label">Within your rules:</p>
      <div class="rule-line">
        <span>Monthly</span>
        <span class="v" id="monthlyLine">--</span>
      </div>
      <div class="meter"><div class="fill" id="monthlyFill"></div></div>
      <div class="rule-line">
        <span>Per-transaction limit</span>
        <span class="v" id="perTxLine">--</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn-secondary" id="declineBtn">Decline</button>
      <button class="btn-primary" id="approveBtn">Approve &amp; pay</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;

(async () => {
  const app = new App({ name: "SpendexConsentDialog", version: "0.1.0" }, {});

  const el = (id) => document.getElementById(id);
  const card = el("card");
  const statusEl = el("status");
  const approveBtn = el("approveBtn");
  const declineBtn = el("declineBtn");

  let payload = null;

  function fmtAmount(amount, currency) {
    const c = (currency || "USD").toUpperCase();
    const symbol = c === "EUR" ? "EUR" : c === "GBP" ? "GBP" : "USD";
    const n = Number(amount);
    if (!Number.isFinite(n)) return { currency: symbol, value: "--" };
    return { currency: symbol, value: n.toFixed(2) };
  }

  function fmtUsd(n) {
    const v = Number(n);
    if (!Number.isFinite(v)) return "--";
    return "$" + v.toFixed(2);
  }

  function render(data) {
    payload = data;

    const action = (data.action || "pay_for_service").replace(/_/g, " ");
    const verb = action === "signup to service"
      ? `Sign up to ${data.service}`
      : action === "subscribe"
      ? `Subscribe to ${data.service}`
      : `Pay for ${data.service}`;
    el("action").textContent = verb;
    el("service").textContent = data.service || "service";
    el("desc").textContent = data.description || "";

    // Product preview — shown when the agent passed product_url/name/image
    const productEl = el("product");
    if (data.product_name || data.product_url || data.product_image_url) {
      productEl.classList.add("show");
      el("productName").textContent = data.product_name || data.product_url || "";
      el("productDesc").textContent = data.product_description || "";
      if (!data.product_description) el("productDesc").style.display = "none";
      const link = el("productLink");
      if (data.product_url) {
        link.textContent = data.product_url.replace(/^https?:\/\//, "").slice(0, 60);
        link.addEventListener("click", (e) => {
          e.preventDefault();
          app.openLink({ url: data.product_url });
        });
      } else {
        link.style.display = "none";
      }
      const imgWrap = el("productImgWrap");
      if (data.product_image_url) {
        imgWrap.textContent = "";
        imgWrap.classList.remove("product-img-fallback");
        const img = document.createElement("img");
        img.src = data.product_image_url;
        img.alt = data.product_name || "Product";
        img.className = "product-img";
        img.onerror = () => {
          imgWrap.textContent = "📦";
          imgWrap.classList.add("product-img-fallback");
        };
        imgWrap.replaceWith(img);
      }
    }

    const a = fmtAmount(data.amount, data.currency);
    el("amountCurrency").textContent = a.currency;
    el("amountValue").textContent = a.value;

    const monthlySpent = Number(data.monthly_spent);
    const monthlyCap = Number(data.monthly_cap);
    if (Number.isFinite(monthlySpent) && Number.isFinite(monthlyCap) && monthlyCap > 0) {
      el("monthlyLine").textContent = `${fmtUsd(monthlySpent)} / ${fmtUsd(monthlyCap)} used`;
      const pct = Math.min(100, Math.max(0, (monthlySpent / monthlyCap) * 100));
      const fill = el("monthlyFill");
      fill.style.width = `${pct}%`;
      fill.classList.remove("warn", "over");
      if (pct >= 90) fill.classList.add("over");
      else if (pct >= 70) fill.classList.add("warn");
    } else if (Number.isFinite(monthlySpent)) {
      el("monthlyLine").textContent = `${fmtUsd(monthlySpent)} used (no cap)`;
      el("monthlyFill").style.width = "0%";
    } else {
      el("monthlyLine").textContent = "no cap configured";
      el("monthlyFill").style.width = "0%";
    }

    if (Number.isFinite(Number(data.per_tx_cap))) {
      el("perTxLine").textContent = fmtUsd(data.per_tx_cap);
    } else {
      el("perTxLine").textContent = "no cap";
    }
  }

  function setBusy(busy) {
    if (busy) card.classList.add("pending");
    else card.classList.remove("pending");
    approveBtn.disabled = busy;
    declineBtn.disabled = busy;
  }

  async function submitDecision(decision) {
    if (!payload || !payload.consent_id) {
      statusEl.textContent = "Missing consent payload — cannot submit.";
      statusEl.className = "status err";
      return;
    }
    setBusy(true);
    statusEl.textContent = "Recording your choice...";
    statusEl.className = "status";

    try {
      await app.callServerTool({
        name: "submit_consent_decision",
        arguments: {
          consent_id: payload.consent_id,
          decision,
          mcp_token: payload.mcp_token,
          decision_metadata: { source: "consent_widget" },
        },
      });
    } catch (err) {
      statusEl.textContent = "Could not record your choice. Please try again.";
      statusEl.className = "status err";
      setBusy(false);
      return;
    }

    if (decision === "approve") {
      statusEl.textContent = "Approved";
      statusEl.className = "status ok";
      setTimeout(() => {
        app.sendMessage({
          role: "user",
          content: [{ type: "text", text: "Approved. Continue." }],
        });
      }, 1000);
    } else {
      statusEl.textContent = "Declined";
      statusEl.className = "status err";
      setTimeout(() => {
        app.sendMessage({
          role: "user",
          content: [{ type: "text", text: "Declined. Don't continue." }],
        });
      }, 1000);
    }
  }

  approveBtn.addEventListener("click", () => submitDecision("approve"));
  declineBtn.addEventListener("click", () => submitDecision("decline"));

  app.ontoolresult = ({ content }) => {
    try {
      const text = content && content[0] && content[0].text;
      if (!text) return;
      let data = null;
      // The tool returns a hybrid payload: a human-readable markdown fallback
      // for non-widget clients, followed by a JSON marker + JSON blob for us.
      // Try the marker first, then fall back to parsing the whole thing as JSON.
      const marker = "<!--SPENDEX_CONSENT_JSON-->";
      const idx = text.indexOf(marker);
      if (idx >= 0) {
        data = JSON.parse(text.slice(idx + marker.length).trim());
      } else {
        data = JSON.parse(text);
      }
      if (data) render(data);
    } catch (err) {
      statusEl.textContent = "Could not parse consent payload.";
      statusEl.className = "status err";
    }
  };

  await app.connect();
})();
</script>
</body>
</html>
